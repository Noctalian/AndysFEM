[package]
name = "mapdl_fast"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mapdl_fast"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
rayon = "1.12"
faer = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
